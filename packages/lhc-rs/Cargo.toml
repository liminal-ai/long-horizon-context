[package]
name = "lhc"
version = "0.1.0"
edition = "2024"
description = "Rust port of the LHC (long-horizon context) SDK — event-sourced capture, derivations, smart compaction"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: JS object key order (insertion order) is part of the
# persisted-bytes contract — see shared_tech/js_json.rs.
serde_json = { version = "1", features = ["preserve_order"] }
# Insertion-ordered maps for typed (non-Value) records where JSON.stringify
# order is load-bearing — serde_json::Map only serde-implements for Value.
indexmap = { version = "2", features = ["serde"] }
# Host packaging note (codex-lhc Chunk 1): bumped 0.37 → 0.39 so libsqlite3-sys
# aligns with codex-rs workspace (0.37). Pure packaging; no LHC semantics change.
# Host-workspace compatibility range: codex-rs pins libsqlite3-sys 0.37
# (forces rusqlite >= 0.39); grok-build pins an older libsqlite3-sys
# (forces rusqlite <= 0.37). links = "sqlite3" allows exactly one major per
# workspace, so the port accepts the range and each fork resolves its own.
# Port source is verified to compile and gate-pass at both edges.
rusqlite = { version = ">=0.37, <0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
futures = "0.3"
regex = "1"
# Lookaround / backrefs (JS `(?!…)`); only where `regex` cannot express the pattern.
fancy-regex = "0.17"
tiktoken-rs = "0.12.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
trybuild = "1"
