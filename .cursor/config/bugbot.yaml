# Read from the PR's BASE branch (a PR cannot change its own review settings).
version: 1
triggers:
  drafts: false
  frequency: oncePerPr      # re-run manually with a `bugbot run` comment; avoids $1-1.50 per push
review:
  effort: default           # low | default | high | smart (effort levels need a usage-based plan)
  incremental: true
prSummary:
  mode: disabled            # Copilot already posts an overview; avoid 4 summaries
  riskScore: false
autofix:
  mode: disabled            # can only lower the dashboard setting; keep agents in control of fixes
