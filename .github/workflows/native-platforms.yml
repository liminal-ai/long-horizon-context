# Native-platform matrix for cc-lhc (Slice XP3).
#
# Proves the source-checkout story on every supported target from
# packages/cc-lhc-native/targets.json: frozen install, dependency-order build,
# real native-addon compile + tests, and the full cc-lhc suite with the
# compiled addon mandatory (CC_LHC_NATIVE_REQUIRE_ADDON=1).
#
# Shells are platform-native on purpose: bash on Linux/macOS, PowerShell
# (pwsh, the runner default) on Windows — Windows evidence must not detour
# through Git Bash. The linux-arm64 and win32-arm64 runner labels
# (ubuntu-24.04-arm, windows-11-arm) are GitHub public-preview labels; they
# are required jobs, not optional ones. win32-x64 stays on windows-2022:
# windows-2025 ships Visual Studio 18, which node-gyp rejects as an unknown
# version (observed in run 31404594096).
#
name: native-platforms

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-platforms.yml"
      - ".setup/**"
      - "install.sh"
      - "install.ps1"
      - "packages/cc-lhc/**"
      - "packages/cc-lhc-native/**"
      - "packages/lhc/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: native-platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            consumer_node: 24.3.0
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            consumer_node: 24.3.0
          - target: darwin-x64
            runner: macos-15-intel
            consumer_node: 24.3.0
          - target: darwin-arm64
            runner: macos-15
            consumer_node: 24.3.0
          - target: win32-x64
            runner: windows-2022
            consumer_node: 24.15.0
          - target: win32-arm64
            runner: windows-11-arm
            consumer_node: 24.15.0
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install pnpm 11.8.0
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Install build Node 24.18.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install workspace (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build lhc
        run: pnpm --filter lhc run build

      - name: Build cc-lhc-native (TypeScript)
        run: pnpm --filter cc-lhc-native run build

      - name: Typecheck cc-lhc-native
        run: pnpm --filter cc-lhc-native run typecheck

      - name: Compile native addon (node-gyp)
        run: pnpm --filter cc-lhc-native run build:native

      - name: Stage prebuild for ${{ matrix.target }}
        run: pnpm --filter cc-lhc-native run stage:prebuild

      - name: Native addon tests (compiled addon mandatory)
        run: pnpm --filter cc-lhc-native run test:native

      - name: Build cc-lhc
        run: pnpm --filter cc-lhc run build

      - name: Typecheck cc-lhc
        run: pnpm --filter cc-lhc run typecheck

      - name: Test cc-lhc (compiled addon mandatory)
        run: pnpm --filter cc-lhc run test
        env:
          CC_LHC_NATIVE_REQUIRE_ADDON: "1"

      - name: Install consumer Node ${{ matrix.consumer_node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.consumer_node }}

      - name: Assemble current-target npm package
        run: node packages/cc-lhc/scripts/assemble-npm-package.mjs --targets current

      - name: Check current-target npm package
        run: node packages/cc-lhc/scripts/check-npm-package.mjs build/cc-lhc-npm

      - name: Smoke global npm install without a compiler
        run: node packages/cc-lhc/scripts/smoke-npm-package.mjs build/cc-lhc-npm

      - name: Assemble standalone runtime bundle
        run: >-
          node packages/cc-lhc/scripts/assemble-standalone-bundle.mjs
          --package-root build/cc-lhc-npm
          --target ${{ matrix.target }}
          --out build/cc-lhc-standalone
          --source-commit ${{ github.sha }}

      - name: Check standalone runtime bundle
        run: >-
          node packages/cc-lhc/scripts/check-standalone-bundle.mjs
          build/cc-lhc-standalone/cc-lhc-v0.1.0-${{ matrix.target }}

      - name: Package standalone runtime bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="cc-lhc-v0.1.0-${TARGET}"
          asset="${bundle}.tar.gz"
          mkdir -p build/standalone-assets
          tar -C build/cc-lhc-standalone -czf "build/standalone-assets/${asset}" "$bundle"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd build/standalone-assets && sha256sum "$asset" > SHA256SUMS)
          else
            (cd build/standalone-assets && shasum -a 256 "$asset" > SHA256SUMS)
          fi

      - name: Package standalone runtime bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $bundle = "cc-lhc-v0.1.0-$env:TARGET"
          $asset = "$bundle.zip"
          New-Item -ItemType Directory -Path build/standalone-assets -Force | Out-Null
          Push-Location build/cc-lhc-standalone
          try {
            Compress-Archive -Path $bundle -DestinationPath "../standalone-assets/$asset"
          } finally {
            Pop-Location
          }
          $hash = (Get-FileHash "build/standalone-assets/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path build/standalone-assets/SHA256SUMS -Value "$hash  $asset" -Encoding Ascii

      - name: Smoke standalone URL installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "${TMPDIR:-/tmp}/cc-lhc-installer-smoke.XXXXXX")"
          cleanup() { case "$scratch" in "${TMPDIR:-/tmp}"/cc-lhc-installer-smoke.*) rm -rf -- "$scratch" ;; esac; }
          trap cleanup EXIT
          mkdir -p "$scratch/home/.cc-lhc"
          touch "$scratch/home/.cc-lhc/preserve-me"
          HOME="$scratch/home" \
          CC_LHC_PREFIX="$scratch/prefix" \
          CC_LHC_INSTALL_ROOT="$scratch/store" \
          ./install.sh --version 0.1.0 --asset-dir build/standalone-assets
          CC_LHC_NATIVE_REQUIRE_ADDON=1 "$scratch/prefix/bin/cc-lhc" --lhc-help >/dev/null
          HOME="$scratch/home" \
          CC_LHC_PREFIX="$scratch/prefix" \
          CC_LHC_INSTALL_ROOT="$scratch/store" \
          ./install.sh --uninstall
          test -f "$scratch/home/.cc-lhc/preserve-me"
          test ! -e "$scratch/store"

      - name: Smoke standalone URL installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scratch = Join-Path ([System.IO.Path]::GetTempPath()) "cc-lhc-installer-smoke-$([guid]::NewGuid())"
          $prefix = Join-Path $scratch prefix
          $store = Join-Path $scratch store
          try {
            & ./install.ps1 -Version 0.1.0 -Prefix $prefix -InstallRoot $store -AssetDir build/standalone-assets
            if ($LASTEXITCODE -ne 0) { throw "installer failed" }
            $env:CC_LHC_NATIVE_REQUIRE_ADDON = "1"
            & (Join-Path $prefix "bin/cc-lhc.cmd") --lhc-help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "installed launcher failed" }
            & ./install.ps1 -Prefix $prefix -InstallRoot $store -Uninstall
            if (Test-Path $store) { throw "uninstall left the managed store" }
          } finally {
            Remove-Item Env:CC_LHC_NATIVE_REQUIRE_ADDON -ErrorAction SilentlyContinue
            if (Test-Path $scratch) { Remove-Item $scratch -Recurse -Force }
          }

      - name: Preserve standalone runtime bundle
        uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ matrix.target }}
          path: |
            build/standalone-assets/*.tar.gz
            build/standalone-assets/*.zip
          if-no-files-found: error

      - name: Preserve native prebuild for package aggregation
        uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.target }}
          path: packages/cc-lhc-native/prebuilds/${{ matrix.target }}/cc_lhc_identity.node
          if-no-files-found: error

  npm-package:
    name: npm-package
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install pnpm 11.8.0
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Install build Node 24.18.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install workspace (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build JavaScript runtimes
        run: |
          pnpm --filter lhc run build
          pnpm --filter cc-lhc-native run build
          pnpm --filter cc-lhc run build

      - name: Download all native prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: prebuild-*
          path: build/native-artifacts

      - name: Assemble complete native bundle
        run: |
          node packages/cc-lhc-native/scripts/assemble-release-bundle.mjs \
            --artifacts build/native-artifacts \
            --bundle-out build/cc-lhc-native \
            --assets-out build/native-assets

      - name: Install consumer Node 24.3.0 baseline
        uses: actions/setup-node@v7
        with:
          node-version: 24.3.0

      - name: Assemble complete npm package
        run: |
          node packages/cc-lhc/scripts/assemble-npm-package.mjs \
            --native-bundle build/cc-lhc-native \
            --targets all

      - name: Check and smoke complete npm package
        run: |
          node packages/cc-lhc/scripts/check-npm-package.mjs build/cc-lhc-npm
          node packages/cc-lhc/scripts/smoke-npm-package.mjs build/cc-lhc-npm

      - name: Pack npm package
        run: |
          mkdir -p build/npm-artifact
          npm pack ./build/cc-lhc-npm --pack-destination build/npm-artifact

      - name: Preserve npm package
        uses: actions/upload-artifact@v7
        with:
          name: cc-lhc-npm-package
          path: build/npm-artifact/*.tgz
          if-no-files-found: error

  standalone-release:
    name: standalone-release
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v7

      - name: Download all standalone bundles
        uses: actions/download-artifact@v8
        with:
          pattern: standalone-*
          path: build/standalone-release
          merge-multiple: true

      - name: Assemble standalone release candidate
        run: |
          set -euo pipefail
          cd build/standalone-release
          expected=(
            cc-lhc-v0.1.0-linux-x64.tar.gz
            cc-lhc-v0.1.0-linux-arm64.tar.gz
            cc-lhc-v0.1.0-darwin-x64.tar.gz
            cc-lhc-v0.1.0-darwin-arm64.tar.gz
            cc-lhc-v0.1.0-win32-x64.zip
            cc-lhc-v0.1.0-win32-arm64.zip
          )
          for asset in "${expected[@]}"; do test -f "$asset"; done
          test "$(find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) -type f | wc -l)" -eq 6
          sha256sum "${expected[@]}" > SHA256SUMS
          cp ../../install.sh ../../install.ps1 .
          SOURCE_COMMIT="$GITHUB_SHA" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readdirSync, readFileSync, writeFileSync } from "node:fs";
          const assets = readdirSync(".").filter((name) => /\.(?:tar\.gz|zip)$/.test(name)).sort();
          const hashes = Object.fromEntries(assets.map((name) => [
            name,
            createHash("sha256").update(readFileSync(name)).digest("hex"),
          ]));
          writeFileSync("release-manifest.json", `${JSON.stringify({
            schemaVersion: 1,
            product: "cc-lhc",
            version: "0.1.0",
            sourceCommit: process.env.SOURCE_COMMIT,
            assets: hashes,
          }, null, 2)}\n`);
          NODE
          sha256sum --check --strict SHA256SUMS

      - name: Preserve standalone release candidate
        uses: actions/upload-artifact@v7
        with:
          name: cc-lhc-standalone-release
          path: build/standalone-release/*
          if-no-files-found: error
