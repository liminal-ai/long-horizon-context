name: Claude review (Opus 5.5)

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/*.lock"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "package-lock.json"
      - ".repos/**"
      - "vendor/**"
      - "third-party/**"
      - "**/dist/**"
      - "**/build/**"
      - "packages/**/CHANGELOG.md"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Once per PR when it's ready; re-run by adding the `ai-rereview` label.
    # Skip forks and opt-outs. Secret gating is handled at step-level via env mapping.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-rereview')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      id-token: write   # lets the already-installed Claude GitHub App mint its token
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Optional: give Copilot/Bugbot a head start so their comments exist to dedupe against.
      - if: env.ANTHROPIC_API_KEY != ''
        run: sleep 240

      - name: Claude review
        if: env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515  # v1.0.245
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Alternative: claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} (bills Lee's Claude plan, not the API)
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}  PR: #${{ github.event.pull_request.number }}
            Read .github/REVIEW_RULES.md and follow it. You are the Claude reviewer. Your lane is security, secrets/PII in logs,
            auth, concurrency/races, data integrity, and cross-module contracts.
            LHC-specific: scrutinize context persistence, resume cursor flips, and compaction/prune invariants across packages.
            1. `gh pr diff ${{ github.event.pull_request.number }}` and read the surrounding code you need.
            2. Read the existing review comments:
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
               and `gh pr view ${{ github.event.pull_request.number }} --comments`. Do NOT repeat anything already flagged.
            3. Post at most 5 inline comments for real issues in your lane, using
               mcp__github_inline_comment__create_inline_comment with confirmed=true.
            4. Put a 1-3 line verdict in the sticky comment. If you found nothing, say "Claude: no issues in lane".
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"

      - name: Skip (ANTHROPIC_API_KEY not set)
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY not set; skipping Claude review."
