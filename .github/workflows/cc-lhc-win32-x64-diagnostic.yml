name: cc-lhc-win32-x64-diagnostic

on:
  push:
    branches: [release/cc-lhc-v1-recovery]
    paths: [.github/workflows/cc-lhc-win32-x64-diagnostic.yml]
  workflow_dispatch:

jobs:
  ownership-race:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter lhc run build
      - run: pnpm --filter cc-lhc-native run build
      - run: pnpm --filter cc-lhc-native run build:native
      - run: pnpm --filter cc-lhc-native run stage:prebuild

      - name: Add structured worker diagnostics in the runner only
        shell: pwsh
        run: |
          $path = "packages/cc-lhc/test/fixtures/session-owner-race-worker.ts"
          $text = [System.IO.File]::ReadAllText($path)
          $old = @'
            const name = cause instanceof Error ? cause.name : "UnknownError";
            process.stdout.write(`LOST ${name}\n`);
          '@
          $new = @'
            const name = cause instanceof Error ? cause.name : "UnknownError";
            const error = cause as NodeJS.ErrnoException;
            const message = cause instanceof Error ? cause.message : String(cause);
            process.stderr.write(`RACE_LOSS ${JSON.stringify({ name, code: error.code ?? null, syscall: error.syscall ?? null, path: error.path ?? null, message })}\n`);
            process.stdout.write(`LOST ${name}\n`);
          '@
          if (-not $text.Contains($old)) { throw "diagnostic patch anchor missing" }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

      - name: Repeat strict ownership-race proof
        shell: pwsh
        env:
          CC_LHC_NATIVE_REQUIRE_ADDON: "1"
        run: |
          1..100 | ForEach-Object {
            Write-Host "ownership-race diagnostic iteration $_"
            pnpm --filter cc-lhc exec vitest run test/runtime/session-owner.test.ts -t "concurrent workers" --reporter verbose
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
