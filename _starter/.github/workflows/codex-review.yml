name: Codex review (GPT-6.1 Sol)

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/pnpm-lock.yaml"
      - ".repos/**"

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-rereview')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5   # pin to a commit SHA before merging
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Fetch base/head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Wait for faster bots, then snapshot their comments (for dedupe)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          sleep 300
          mkdir -p .ai-review
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" --paginate \
            --jq '.[] | "[\(.user.login)] \(.path):\(.line // .original_line) — \(.body | split("\n")[0])"' \
            > .ai-review/prior-comments.txt || true

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675  # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-6.1-sol
          effort: high
          permission-profile: ":read-only"
          prompt: |
            PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read .github/REVIEW_RULES.md and follow it. You are the Codex reviewer. Your lane is P0/P1 correctness bugs
            and missing tests for changed behavior.
            Review ONLY: git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            Already flagged by other bots (do NOT repeat): see .ai-review/prior-comments.txt
            Output Markdown: at most 5 items, each "**[P0|P1] title**: path:line, failure scenario, fix".
            If there is nothing at P0/P1 that isn't already flagged, output exactly: NO_FINDINGS

  post:
    needs: codex
    if: needs.codex.outputs.final_message != '' && !startsWith(needs.codex.outputs.final_message, 'NO_FINDINGS')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Upsert sticky Codex comment
        uses: actions/github-script@v7
        env:
          BODY: ${{ needs.codex.outputs.final_message }}
        with:
          script: |
            const marker = '<!-- codex-gpt-6.1-sol-review -->';
            const body = `${marker}\n### Codex review (gpt-6.1-sol)\n\n${process.env.BODY}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const prior = comments.find(c => c.body && c.body.includes(marker));
            if (prior) await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
